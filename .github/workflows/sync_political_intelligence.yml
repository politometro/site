name: Atualizar Promessas e Votações

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      all_history:
        description: 'Atualizar também todas as legislaturas históricas (execução mais longa)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: political-intelligence-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências de sincronização
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Atualizar notícias, promessas e Assembleia
        run: |
          if [ "${{ inputs.all_history }}" = "true" ]; then
            python scripts/political_intelligence.py all --since-days 0 --all-history --force-assembly --max-detail-pages all
          else
            python scripts/political_intelligence.py all --max-detail-pages all
          fi

      - name: Guardar atualização publicada
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -A data/political_intelligence_state.json website/public/political-intelligence.json scripts/extracted_chunks_political_intelligence.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar promessas e votações [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              sleep 10
            done
          fi
