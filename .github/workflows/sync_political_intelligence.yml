name: Sync Political Intelligence to Pinecone (weekly)

on:
  schedule:
    # Mondays at 04:00 UTC
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: pinecone-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
      PINECONE_INDEX_NAME: ${{ secrets.PINECONE_INDEX_NAME }}
      # O envio usa embeddings alojados no Pinecone -> evita descarregar modelo local de 2,4 GB no CI.
      PINECONE_EMBEDDINGS: pinecone
      LOCAL_EMBEDDING_MODEL: intfloat/multilingual-e5-large
      # O texto integral dos chunks fica no Turso (o Pinecone free guarda apenas vetores).
      TURSO_URL: ${{ secrets.TURSO_URL }}
      TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - name: Restore upload tracking state (incremental across runs)
        uses: actions/download-artifact@v4
        with:
          name: pinecone-tracking
          path: scripts
          if-no-files-found: ignore

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pinecone requests
          pip install -r scripts/requirements.txt

      - name: Extract programmes / budgets (incremental)
        run: |
          python scripts/extract_text.py
          python scripts/extract_eu_budget.py

      - name: Crawl recent political intelligence (last 7 days)
        run: |
          python scripts/political_intelligence.py all --since-days 7

      - name: Envia apenas os chunks novos para o Pinecone (apenas vetores; texto vai para o Turso, incremental)
        run: |
          python scripts/upload_pinecone.py --embedding-mode pinecone

      - name: Save upload tracking state for next run
        uses: actions/upload-artifact@v4
        with:
          name: pinecone-tracking
          path: scripts/pinecone_upload_state.json
          if-no-files-found: ignore
          retention-days: 90
