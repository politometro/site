name: Atualizar inteligência política e Pinecone

on:
  # GitHub cron usa UTC. Estes dois horários cobrem inverno/verão; o guard
  # abaixo deixa passar apenas a execução que corresponde às 11:00 em Lisboa.
  schedule:
    - cron: '0 11 * * 6'
    - cron: '0 10 * * 6'
  workflow_dispatch:
    inputs:
      all_history:
        description: 'Atualizar também todas as legislaturas históricas'
        required: false
        default: false
        type: boolean
      upload_pinecone:
        description: 'Enviar os chunks pendentes nesta execução'
        required: false
        default: true
        type: boolean
      upload_limit:
        description: 'Limitar chunks enviados (útil para o primeiro backfill)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: political-intelligence-weekly
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Obter o projeto
        uses: actions/checkout@v7

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Instalar dependências de sincronização e embeddings locais
        run: |
          python -m pip install --upgrade pip
          pip install requests pypdf orjson pinecone sentence-transformers

      - name: Restaurar estado da recolha
        uses: actions/cache/restore@v4
        with:
          path: data/political_intelligence_state.json
          key: political-intelligence-state-${{ github.run_id }}
          restore-keys: |
            political-intelligence-state-

      - name: Confirmar sábado às 11:00 em Lisboa
        id: schedule_guard
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          local_slot=$(TZ=Europe/Lisbon date '+%u-%H')
          if [ "$local_slot" = "6-11" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Execução válida: sábado às 11:00 Europe/Lisbon."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Esta variante UTC não corresponde às 11:00 em Lisboa ($local_slot); termina sem alterar dados."
          fi

      - name: Extrair programas e orçamentos para os corpora temporários
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          python scripts/extract_text.py
          python scripts/extract_eu_budget.py --force

      - name: Atualizar notícias, promessas, iniciativas e votações
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          if [ "${{ inputs.all_history }}" = "true" ]; then
            python scripts/political_intelligence.py all --since-days 0 --all-history --force-assembly --max-detail-pages all --checkpoint-interval-seconds 300
          else
            python scripts/political_intelligence.py all --since-days 14 --max-detail-pages all
          fi

      - name: Enviar apenas chunks novos ou alterados para Pinecone
        if: steps.schedule_guard.outputs.run == 'true' && (github.event_name == 'schedule' || inputs.upload_pinecone != false)
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX_NAME: ${{ vars.PINECONE_INDEX_NAME || 'politometro' }}
          PINECONE_EMBEDDINGS: local
          LOCAL_EMBEDDING_MODEL: intfloat/multilingual-e5-large
        run: |
          if [ -n "${{ inputs.upload_limit }}" ]; then
            python scripts/upload_pinecone.py --embedding-mode local --limit "${{ inputs.upload_limit }}"
          else
            python scripts/upload_pinecone.py --embedding-mode local
          fi

      - name: Guardar estado e publicar painel em shards
        if: steps.schedule_guard.outputs.run == 'true'
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add -A website/public/political-intelligence.json website/public/political-intelligence-shards scripts/pinecone_upload_state.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar inteligência política e Pinecone [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase origin main && git push && exit 0
              if [ "$attempt" -eq 3 ]; then exit 1; fi
              sleep 10
            done
          fi

      - name: Persistir estado grande entre execuções
        if: always() && steps.schedule_guard.outputs.run == 'true' && hashFiles('data/political_intelligence_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: data/political_intelligence_state.json
          key: political-intelligence-state-${{ github.run_id }}
